        id:
          type: integer
          example: 1
        username:
          type: string
          example: "coach_ivanov"
        email:
          type: string
          example: "ivanov@school.com"
        role:
          type: string
          enum: [ADMIN, COACH]
          example: "COACH"
        fullName:
          type: string
          example: "Иван Иванов"
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserCreate:
