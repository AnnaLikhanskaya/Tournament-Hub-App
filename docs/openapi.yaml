openapi: 3.0.3
info:
  title: Tournament Hub+ API
  version: 1.0.0
  description: |
    API для автоматизации управления спортивными турнирами баскетбольной школы.
    Система позволяет управлять сезонами, турнирами, командами, спортсменами, матчами и генерировать отчеты.

servers:
  - url: http://localhost:8080/api/v1
    description: Сервер для разработки и тестирования
  - url: https://api.tournamenthub.ru/api/v1
    description: Продакшен сервер

security:
  - bearerAuth: []

paths:
  # Аутентификация
  /auth/login:
    post:
      tags: [Аутентификация]
      summary: Вход пользователя в систему
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "coach_ivanov"
                password:
                  type: string
                  format: password
                  example: "myPassword123"
              required: [username, password]
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: '#/components/schemas/User'

  /auth/me:
    get:
      tags: [Аутентификация]
      summary: Получить информацию о текущем пользователе
      operationId: getCurrentUser
      responses:
        '200':
          description: Успешное получение информации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # Пользователи
  /users:
    get:
      tags: [Пользователи]
      summary: Получить список пользователей
      operationId: getUsers
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [ADMIN, COACH]
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Успешное получение списка пользователей
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Пользователи]
      summary: Создать нового пользователя
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Пользователи]
      summary: Получить информацию о пользователе
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение информации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags: [Пользователи]
      summary: Обновить информацию о пользователе
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Пользователь успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags: [Пользователи]
      summary: Удалить пользователя
      operationId: deactivateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Пользователь удалён

  /users/{id}/password:
    put:
      tags: [Пользователи]
      summary: Сменить пароль пользователя
      operationId: changeUserPassword
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Пароль успешно изменен

  # Сезоны
  /seasons:
    get:
      tags: [Сезоны]
      summary: Получить список сезонов
      operationId: getSeasons
      parameters:
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Фильтр по активному сезону
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Успешное получение списка сезонов
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Season'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Сезоны]
      summary: Создать новый сезон
      operationId: createSeason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonCreate'
      responses:
        '201':
          description: Сезон успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

  /seasons/{id}:
    get:
      tags: [Сезоны]
      summary: Получить информацию о сезоне
      operationId: getSeasonById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение информации о сезоне
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

    put:
      tags: [Сезоны]
      summary: Обновить информацию о сезоне
      operationId: updateSeason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeasonUpdate'
      responses:
        '200':
          description: Сезон успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'

    delete:
      tags: [Сезоны]
      summary: Удалить сезон
      operationId: deleteSeason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Сезон успешно удалён

  /seasons/{id}/activate:
    post:
      tags: [Сезоны]
      summary: Активировать сезон
      operationId: activateSeason
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Сезон успешно активирован

  # Турниры
  /tournaments:
    get:
      tags: [Турниры]
      summary: Получить список турниров
      operationId: getTournaments
      parameters:
        - name: seasonId
          in: query
          schema:
            type: integer
          description: Фильтр по ID сезона
        - name: status
          in: query
          schema:
            type: string
            enum: [PLANNED, ONGOING, COMPLETED, CANCELLED]
        - name: tournamentType
          in: query
          schema:
            type: string
            enum: [REGULAR_SEASON, PLAYOFF, FRIENDLY, CHAMPIONSHIP]
        - name: createdBy
          in: query
          schema:
            type: integer
          description: Фильтр по создателю
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Успешное получение списка турниров
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tournament'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Турниры]
      summary: Создать новый турнир
      operationId: createTournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentCreate'
      responses:
        '201':
          description: Турнир успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'

  /tournaments/{id}:
    get:
      tags: [Турниры]
      summary: Получить информацию о турнире
      operationId: getTournamentById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение информации о турнире
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentDetails'

    put:
      tags: [Турниры]
      summary: Обновить информацию о турнире
      operationId: updateTournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TournamentUpdate'
      responses:
        '200':
          description: Турнир успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tournament'

    delete:
      tags: [Турниры]
      summary: Удалить турнир
      operationId: deleteTournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Турнир успешно удалён

  /tournaments/{id}/register-team:
    post:
      tags: [Турниры]
      summary: Зарегистрировать команду в турнире
      operationId: registerTeamInTournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId, groupName]
              properties:
                teamId:
                  type: integer
                  example: 1
                groupName:
                  type: string
                  example: "Группа A"
      responses:
        '200':
          description: Команда успешно зарегистрирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentParticipation'

  /tournaments/{id}/participants:
    get:
      tags: [Турниры]
      summary: Получить список участников турнира
      operationId: getTournamentParticipants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: groupName
          in: query
          schema:
            type: string
          description: Фильтр по группе
      responses:
        '200':
          description: Успешное получение списка участников
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TournamentParticipationDetails'

  /tournaments/{id}/unregister-team/{teamId}:
    delete:
      tags: [Турниры]
      summary: Отменить регистрацию команды в турнире
      operationId: unregisterTeamFromTournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Команда успешно отменена

  # Команды
  /teams:
    get:
      tags: [Команды]
      summary: Получить список команд
      operationId: getTeams
      parameters:
        - name: coachId
          in: query
          schema:
            type: integer
          description: Фильтр по ID тренера
        - name: city
          in: query
          schema:
            type: string
          description: Фильтр по городу
        - name: gender
          in: query
          schema:
            type: string
            enum: [MALE, FEMALE]
          description: Фильтр по полу команды
        - name: yearGroup
          in: query
          schema:
            type: string
          description: Фильтр по году рождения
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Успешное получение списка команд
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Команды]
      summary: Создать новую команду
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: Команда успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

  /teams/{id}:
    get:
      tags: [Команды]
      summary: Получить информацию о команде
      operationId: getTeamById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение информации о команде
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetails'

    put:
      tags: [Команды]
      summary: Обновить информацию о команде
      operationId: updateTeam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: Команда успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'

    delete:
      tags: [Команды]
      summary: Удалить команду
      operationId: deleteTeam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Команда успешно удалена

  /teams/{id}/tournaments:
    get:
      tags: [Команды]
      summary: Получить турниры команды
      operationId: getTeamTournaments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: seasonId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение турниров команды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tournament'

  # Спортсмены
  /athletes:
    get:
      tags: [Спортсмены]
      summary: Получить список спортсменов
      operationId: getAthletes
      parameters:
        - name: teamId
          in: query
          schema:
            type: integer
          description: Фильтр по ID команды
        - name: gender
          in: query
          schema:
            type: string
            enum: [MALE, FEMALE]
          description: Фильтр по полу
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Успешное получение списка спортсменов
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Athlete'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Спортсмены]
      summary: Добавить спортсмена в команду
      operationId: createAthlete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteCreate'
      responses:
        '201':
          description: Спортсмен успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'

  /athletes/{id}:
    get:
      tags: [Спортсмены]
      summary: Получить информацию о спортсмене
      operationId: getAthleteById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение информации о спортсмене
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'

    put:
      tags: [Спортсмены]
      summary: Обновить информацию о спортсмене
      operationId: updateAthlete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AthleteUpdate'
      responses:
        '200':
          description: Информация о спортсмене успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Athlete'

    delete:
      tags: [Спортсмены]
      summary: Удалить спортсмена
      operationId: deleteAthlete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Спортсмен успешно удалён

  /athletes/{id}/statistics:
    get:
      tags: [Спортсмены]
      summary: Получить статистику спортсмена
      operationId: getAthleteStatistics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: seasonId
          in: query
          schema:
            type: integer
        - name: tournamentId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение статистики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteStatistics'

  # Матчи
  /matches:
    get:
      tags: [Матчи]
      summary: Получить список матчей
      operationId: getMatches
      parameters:
        - name: tournamentId
          in: query
          schema:
            type: integer
          description: Фильтр по ID турнира
        - name: teamId
          in: query
          schema:
            type: integer
          description: Фильтр по ID команды
        - name: status
          in: query
          schema:
            type: string
            enum: [SCHEDULED, LIVE, COMPLETED, CANCELLED]
          description: Фильтр по статусу матча
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: Фильтр по дате от
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: Фильтр по дате до
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Успешное получение списка матчей
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchDetails'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

    post:
      tags: [Матчи]
      summary: Создать новый матч
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreate'
      responses:
        '201':
          description: Матч успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'

  /matches/{id}:
    get:
      tags: [Матчи]
      summary: Получить информацию о матче
      operationId: getMatchById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение информации о матче
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchDetails'

    put:
      tags: [Матчи]
      summary: Обновить информацию о матче
      operationId: updateMatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchUpdate'
      responses:
        '200':
          description: Матч успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'

    delete:
      tags: [Матчи]
      summary: Удалить матч
      operationId: deleteMatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Матч успешно удалён

  /matches/{id}/result:
    post:
      tags: [Матчи]
      summary: Внести результат матча
      operationId: addMatchResult
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchStatisticsCreate'
      responses:
        '200':
          description: Результат матча успешно добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatistics'

  /matches/{id}/player-stats:
    post:
      tags: [Матчи]
      summary: Добавить статистику игрока в матче
      operationId: addPlayerStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PlayerStatsCreate'
      responses:
        '200':
          description: Статистика игроков успешно добавлена
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStats'

    get:
      tags: [Матчи]
      summary: Получить статистику игроков матча
      operationId: getMatchPlayerStats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение статистики
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStats'

  /matches/{id}/start:
    post:
      tags: [Матчи]
      summary: Начать матч
      operationId: startMatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Матч успешно начат

  /matches/{id}/complete:
    post:
      tags: [Матчи]
      summary: Завершить матч
      operationId: completeMatch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Матч успешно завершен

  # Статистика
  /statistics/teams/{teamId}:
    get:
      tags: [Статистика]
      summary: Получить статистику команды
      operationId: getTeamStatistics
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
        - name: seasonId
          in: query
          schema:
            type: integer
        - name: tournamentId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение статистики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamStatistics'

  /statistics/tournaments/{tournamentId}:
    get:
      tags: [Статистика]
      summary: Получить статистику турнира
      operationId: getTournamentStatistics
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Успешное получение статистики
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentStatistics'

  # Отчеты
  /reports/tournament/{tournamentId}:
    get:
      tags: [Отчеты]
      summary: Сгенерировать отчет по турниру
      operationId: generateTournamentReport
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema:
            type: integer
        - name: reportType
          in: query
          required: true
          schema:
            type: string
            enum: [STANDINGS, STATISTICS, PARTICIPATION]
          description: Тип отчета
      responses:
        '200':
          description: Отчет успешно сгенерирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TournamentReport'

  /reports/team/{teamId}:
    get:
      tags: [Отчеты]
      summary: Сгенерировать отчет по команде
      operationId: generateTeamReport
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: integer
        - name: seasonId
          in: query
          schema:
            type: integer
          description: ID сезона (если не указан - текущий сезон)
        - name: reportType
          in: query
          required: true
          schema:
            type: string
            enum: [PERFORMANCE, STATISTICS, PLAYERS]
      responses:
        '200':
          description: Отчет успешно сгенерирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamReport'

  /reports/player/{playerId}:
    get:
      tags: [Отчеты]
      summary: Сгенерировать отчет по игроку
      operationId: generatePlayerReport
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
        - name: seasonId
          in: query
          schema:
            type: integer
        - name: tournamentId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Отчет успешно сгенерирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerReport'

  /reports/history:
    get:
      tags: [Отчеты]
      summary: Получить историю сгенерированных отчетов
      operationId: getReportHistory
      parameters:
        - name: generatedBy
          in: query
          schema:
            type: integer
        - name: reportType
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Успешное получение истории
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportHistoryItem'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
